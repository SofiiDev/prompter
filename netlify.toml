# EasyPrompter (/) y Ritmo (/ritmo/) — sitios estáticos, sin paso de build.
# Ritmo usa Supabase (datos y login) y funciones en netlify/functions
# (IA y Strava). Variables de entorno necesarias: ver README.
[build]
  publish = "."
  command = "npm run build"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    # Política de contenido estricta: solo recursos propios + Google Fonts.
    # Bloquea scripts inline/externos, iframes, objetos y envíos de formularios.
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; manifest-src 'self'; connect-src 'self' https://*.supabase.co wss://*.supabase.co; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; upgrade-insecure-requests"
    # La app no usa cámara, micrófono ni sensores: negarlos explícitamente.
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), midi=(), magnetometer=(), gyroscope=(), accelerometer=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"

[[headers]]
  for = "/sw.js"
  [headers.values]
    # el navegador debe revalidar el service worker en cada visita
    Cache-Control = "no-cache"

[[headers]]
  for = "/ritmo/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
